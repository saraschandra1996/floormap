version: '3.8'
services:
  floormap:
    build: .
    network_mode: "bridge"
    container_name: floormap_dashboard
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - ./mapping.csv:/opt/floormap/mapping.csv
      - ./floormap.db:/opt/floormap/floormap.db
      - ./live_status.json:/opt/floormap/live_status.json
    env_file:
      - .env
    # Integrated Docker scheduling to run the python fetch script every 12 hours
    entrypoint: >
      /bin/sh -c "
      gunicorn --workers 3 --bind 0.0.0.0:8080 app:app &
      while true; do
        python3 fetch_data.py
        sleep 43200
      done
      "
